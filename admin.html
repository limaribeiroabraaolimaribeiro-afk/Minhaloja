<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Administrativo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Cloudinary Widget -->
<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

header {
  background: #22b8a0;
  color: white;
  padding: 18px;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}

.container {
  padding: 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.btn {
  background: #22b8a0;
  color: white;
}

.btn-sec {
  background: #ddd;
}

.produto {
  display: flex;
  gap: 12px;
}

.produto img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 10px;
}

.produto-info {
  flex: 1;
}

.status {
  font-size: 13px;
  margin-top: 4px;
}

.ativo { color: green; }
.inativo { color: red; }
</style>
</head>

<body>

<header>📦 Painel de Produtos</header>

<div class="container">

<div class="card">
  <h3>Novo Produto</h3>

  <input id="nome" placeholder="Nome do produto">
  <input id="preco" type="number" placeholder="Preço (ex: 15)">

  <button class="btn-sec" onclick="uploadImagem()">📷 Enviar imagem</button>
  <input id="imagem" placeholder="URL da imagem" readonly>

  <button class="btn" onclick="adicionarProduto()">➕ Adicionar Produto</button>
</div>

<div id="lista"></div>

</div>

<script type="module">
import { db, auth } from "./firebase.js";
import {
  collection, addDoc, onSnapshot,
  deleteDoc, doc, updateDoc,
  query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// 🔐 Proteção
onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
});

// 📷 Upload Cloudinary
window.uploadImagem = () => {
  cloudinary.openUploadWidget({
    cloudName: "dhbuwhdwe",
    uploadPreset: "produtos_site",
    folder: "produtos",
    sources: ["local", "camera"],
    language: "pt"
  }, (error, result) => {
    if (!error && result.event === "success") {
      document.getElementById("imagem").value = result.info.secure_url;
    }
  });
};

// ➕ Adicionar produto
window.adicionarProduto = async () => {
  const nome = nome.value;
  const preco = preco.value;
  const imagem = imagem.value;

  if (!nome || !preco || !imagem) {
    alert("Preencha todos os campos");
    return;
  }

  await addDoc(collection(db, "produtos"), {
    nome,
    preco: Number(preco),
    imagem,
    ativo: true,
    ordem: Date.now()
  });

  nome.value = "";
  preco.value = "";
  imagem.value = "";
};

// 📦 Listar produtos
const lista = document.getElementById("lista");
const q = query(collection(db, "produtos"), orderBy("ordem", "desc"));

onSnapshot(q, snap => {
  lista.innerHTML = "";
  snap.forEach(d => {
    const p = d.data();
    lista.innerHTML += `
      <div class="card produto">
        <img src="${p.imagem}">
        <div class="produto-info">
          <strong>${p.nome}</strong><br>
          💰 R$ ${p.preco}
          <div class="status ${p.ativo ? 'ativo' : 'inativo'}">
            ${p.ativo ? 'Ativo' : 'Inativo'}
          </div>

          <button onclick="toggle('${d.id}', ${!p.ativo})">
            ${p.ativo ? 'Desativar' : 'Ativar'}
          </button>

          <button style="background:#e03131;color:white"
            onclick="excluir('${d.id}')">
            Excluir
          </button>
        </div>
      </div>
    `;
  });
});

window.toggle = async (id, estado) =>
  updateDoc(doc(db, "produtos", id), { ativo: estado });

window.excluir = async id => {
  if (confirm("Excluir produto?"))
    await deleteDoc(doc(db, "produtos", id));
};
</script>

</body>
</html>
