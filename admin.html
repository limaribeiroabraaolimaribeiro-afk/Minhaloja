<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  padding:15px;
}
h2 {
  text-align:center;
}
.card {
  background:#fff;
  padding:16px;
  border-radius:12px;
  margin-bottom:16px;
}
input, button {
  width:100%;
  padding:12px;
  margin-top:8px;
  font-size:15px;
}
button {
  background:#4CAF50;
  color:#fff;
  border:none;
  border-radius:8px;
}
button.sec {
  background:#2196F3;
}
.produto img {
  width:100%;
  max-width:140px;
  border-radius:10px;
}
.ativo { color:green }
.inativo { color:red }
</style>
</head>

<body>

<h2>📦 Painel de Produtos</h2>

<div class="card">
  <h3>Novo Produto</h3>

  <input id="nome" placeholder="Nome do produto">
  <input id="preco" type="number" placeholder="Preço">

  <button class="sec" onclick="abrirUpload()">📷 Enviar imagem</button>
  <input id="imagem" type="hidden">

  <button onclick="adicionar()">➕ Adicionar Produto</button>
</div>

<div id="lista"></div>

<!-- Cloudinary Widget -->
<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<script type="module">
import { db, auth } from "./firebase.js";
import {
  collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
});

const lista = document.getElementById("lista");

const uploadWidget = cloudinary.createUploadWidget({
  cloudName: "dhbuwhdwe",
  uploadPreset: "produtos_site"
}, (error, result) => {
  if (!error && result && result.event === "success") {
    document.getElementById("imagem").value = result.info.secure_url;
    alert("Imagem enviada com sucesso!");
  }
});

window.abrirUpload = () => uploadWidget.open();

window.adicionar = async () => {
  const nome = document.getElementById("nome").value;
  const preco = document.getElementById("preco").value;
  const imagem = document.getElementById("imagem").value;

  if (!nome || !preco || !imagem) {
    alert("Preencha tudo e envie a imagem");
    return;
  }

  await addDoc(collection(db, "produtos"), {
    nome,
    preco: Number(preco),
    imagem,
    ativo: true,
    ordem: Date.now()
  });

  document.getElementById("nome").value = "";
  document.getElementById("preco").value = "";
  document.getElementById("imagem").value = "";

  alert("Produto adicionado!");
};

const q = query(collection(db, "produtos"), orderBy("ordem", "desc"));

onSnapshot(q, snap => {
  lista.innerHTML = "";
  snap.forEach(d => {
    const p = d.data();
    lista.innerHTML += `
      <div class="card produto">
        <img src="${p.imagem}">
        <strong>${p.nome}</strong><br>
        💰 R$ ${p.preco}<br>
        <span class="${p.ativo ? 'ativo' : 'inativo'}">
          ${p.ativo ? 'Ativo' : 'Inativo'}
        </span><br><br>

        <button onclick="toggle('${d.id}', ${!p.ativo})">
          ${p.ativo ? 'Desativar' : 'Ativar'}
        </button>
        <button style="background:red" onclick="del('${d.id}')">
          Excluir
        </button>
      </div>
    `;
  });
});

window.toggle = async (id, estado) => {
  await updateDoc(doc(db, "produtos", id), { ativo: estado });
};

window.del = async id => {
  if (confirm("Excluir produto?"))
    await deleteDoc(doc(db, "produtos", id));
};
</script>

</body>
</html>
