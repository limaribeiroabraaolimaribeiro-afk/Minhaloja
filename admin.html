<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  padding:15px;
}
.card {
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
input, button {
  width:100%;
  padding:10px;
  margin-top:8px;
}
button {
  background:#4CAF50;
  color:#fff;
  border:none;
  font-size:16px;
}
img {
  width:120px;
  border-radius:8px;
}
.ativo { color:green }
.inativo { color:red }
</style>
</head>

<body>

<h2>📦 Painel de Produtos</h2>

<div class="card">
  <h3>Novo Produto</h3>

  <input id="nome" placeholder="Nome do produto">
  <input id="preco" type="number" placeholder="Preço">
  <input id="imagem" placeholder="URL da imagem (Cloudinary)">
  
  <button id="btnAdd">➕ Adicionar Produto</button>
</div>

<div id="lista"></div>

<script type="module">
import {
  db,
  auth
} from "./firebase.js";

import {
  collection,
  addDoc,
  onSnapshot,
  deleteDoc,
  doc,
  updateDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔐 Proteção de login
onAuthStateChanged(auth, user => {
  if (!user) {
    window.location.href = "login.html";
  }
});

// 📌 Elementos
const nomeInput = document.getElementById("nome");
const precoInput = document.getElementById("preco");
const imagemInput = document.getElementById("imagem");
const lista = document.getElementById("lista");
const btnAdd = document.getElementById("btnAdd");

// ➕ Adicionar produto
btnAdd.addEventListener("click", async () => {
  try {
    if (!nomeInput.value || !precoInput.value || !imagemInput.value) {
      alert("Preencha todos os campos");
      return;
    }

    await addDoc(collection(db, "produtos"), {
      nome: nomeInput.value,
      preco: Number(precoInput.value),
      imagem: imagemInput.value,
      ativo: true,
      ordem: Date.now()
    });

    nomeInput.value = "";
    precoInput.value = "";
    imagemInput.value = "";

    alert("✅ Produto adicionado com sucesso!");
  } catch (err) {
    console.error(err);
    alert("❌ Erro ao adicionar produto");
  }
});

// 📦 Listar produtos em tempo real
const q = query(collection(db, "produtos"), orderBy("ordem", "desc"));

onSnapshot(q, snapshot => {
  lista.innerHTML = "";

  snapshot.forEach(docSnap => {
    const p = docSnap.data();
    const id = docSnap.id;

    lista.innerHTML += `
      <div class="card">
        <img src="${p.imagem}">
        <strong>${p.nome}</strong><br>
        💰 R$ ${p.preco}<br>
        <span class="${p.ativo ? 'ativo' : 'inativo'}">
          ${p.ativo ? 'Ativo' : 'Inativo'}
        </span><br><br>

        <button onclick="toggle('${id}', ${!p.ativo})">
          ${p.ativo ? 'Desativar' : 'Ativar'}
        </button>

        <button style="background:red" onclick="del('${id}')">
          Excluir
        </button>
      </div>
    `;
  });
});

// 🔁 Ativar / desativar
window.toggle = async (id, estado) => {
  await updateDoc(doc(db, "produtos", id), { ativo: estado });
};

// 🗑 Excluir
window.del = async (id) => {
  if (confirm("Excluir produto?")) {
    await deleteDoc(doc(db, "produtos", id));
  }
};
</script>

</body>
</html>
