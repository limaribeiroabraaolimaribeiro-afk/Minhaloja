<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  padding:15px;
}
.card {
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
input, button {
  width:100%;
  padding:10px;
  margin-top:8px;
}
button {
  background:#4CAF50;
  color:#fff;
  border:none;
  font-size:16px;
}
img {
  width:120px;
  border-radius:8px;
}
.ativo { color:green }
.inativo { color:red }
</style>

<!-- Cloudinary Upload Widget -->
<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
</head>

<body>

<h2>📦 Painel de Produtos</h2>

<div class="card">
  <h3>Novo Produto</h3>

  <input id="nome" placeholder="Nome do produto">
  <input id="preco" type="number" placeholder="Preço">

  <!-- Guarda a URL automaticamente -->
  <input id="imagem" placeholder="Imagem enviada" readonly>

  <button id="btnUpload">📤 Enviar imagem</button>
  <button id="btnAdd">➕ Adicionar Produto</button>
</div>

<div id="lista"></div>

<script type="module">
import { db, auth } from "./firebase.js";

import {
  collection,
  addDoc,
  onSnapshot,
  deleteDoc,
  doc,
  updateDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔐 Proteção */
onAuthStateChanged(auth, user => {
  if (!user) window.location.href = "login.html";
});

/* 📌 Elementos */
const nome = document.getElementById("nome");
const preco = document.getElementById("preco");
const imagem = document.getElementById("imagem");
const lista = document.getElementById("lista");

/* ☁️ Cloudinary Upload */
const widget = cloudinary.createUploadWidget({
  cloudName: "dhbuwhdwe",
  folder: "produtos",
  cropping: false
}, (error, result) => {
  if (!error && result && result.event === "success") {
    imagem.value = result.info.secure_url;
    alert("✅ Imagem enviada com sucesso!");
  }
});

document.getElementById("btnUpload").onclick = () => widget.open();

/* ➕ Adicionar produto */
document.getElementById("btnAdd").onclick = async () => {
  if (!nome.value || !preco.value || !imagem.value) {
    alert("Preencha tudo e envie a imagem");
    return;
  }

  await addDoc(collection(db, "produtos"), {
    nome: nome.value,
    preco: Number(preco.value),
    imagem: imagem.value,
    ativo: true,
    ordem: Date.now()
  });

  nome.value = "";
  preco.value = "";
  imagem.value = "";

  alert("✅ Produto cadastrado!");
};

/* 📦 Listagem */
const q = query(collection(db, "produtos"), orderBy("ordem", "desc"));

onSnapshot(q, snap => {
  lista.innerHTML = "";
  snap.forEach(d => {
    const p = d.data();
    lista.innerHTML += `
      <div class="card">
        <img src="${p.imagem}">
        <strong>${p.nome}</strong><br>
        💰 R$ ${p.preco}<br>
        <span class="${p.ativo ? 'ativo' : 'inativo'}">
          ${p.ativo ? 'Ativo' : 'Inativo'}
        </span><br><br>

        <button onclick="toggle('${d.id}', ${!p.ativo})">
          ${p.ativo ? 'Desativar' : 'Ativar'}
        </button>

        <button style="background:red" onclick="del('${d.id}')">
          Excluir
        </button>
      </div>
    `;
  });
});

/* 🔁 Ações */
window.toggle = async (id, estado) => {
  await updateDoc(doc(db, "produtos", id), { ativo: estado });
};

window.del = async id => {
  if (confirm("Excluir produto?"))
    await deleteDoc(doc(db, "produtos", id));
};
</script>

</body>
</html>
