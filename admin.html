<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Administrativo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Cloudinary Widget -->
<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}

h1 {
  text-align:center;
  margin-bottom:20px;
}

.card {
  background:#fff;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}

input, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:15px;
}

button {
  background:#4CAF50;
  color:#fff;
  border:none;
  cursor:pointer;
}

button.sec {
  background:#555;
}

button.del {
  background:#e53935;
}

.produto {
  display:flex;
  gap:15px;
  align-items:center;
}

.produto img {
  width:90px;
  border-radius:8px;
}

.info {
  flex:1;
}

.status {
  font-weight:bold;
}

.ativo { color:green }
.inativo { color:red }
</style>
</head>

<body>

<h1>📦 Painel de Produtos</h1>

<div class="card">
  <h3>Novo Produto</h3>

  <input id="nome" placeholder="Nome do produto">
  <input id="preco" type="number" placeholder="Preço">

  <button id="uploadBtn" class="sec">📷 Enviar imagem</button>

  <input id="imagem" placeholder="Imagem enviada" disabled>

  <button id="addBtn">➕ Adicionar Produto</button>
</div>

<div id="lista"></div>

<script type="module">
import { db, auth } from "./firebase.js";
import {
  collection, addDoc, onSnapshot,
  deleteDoc, updateDoc, doc, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔐 Proteção
onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
});

const nome = document.getElementById("nome");
const preco = document.getElementById("preco");
const imagem = document.getElementById("imagem");
const lista = document.getElementById("lista");

// 📷 Cloudinary Upload
const widget = cloudinary.createUploadWidget({
  cloudName: "dhbuwhdwe",
  uploadPreset: "produtos_site"
}, (error, result) => {
  if (!error && result.event === "success") {
    imagem.value = result.info.secure_url;
  }
});

document.getElementById("uploadBtn").onclick = () => widget.open();

// ➕ Adicionar
document.getElementById("addBtn").onclick = async () => {
  if (!nome.value || !preco.value || !imagem.value) {
    alert("Preencha todos os campos");
    return;
  }

  await addDoc(collection(db, "produtos"), {
    nome: nome.value,
    preco: Number(preco.value),
    imagem: imagem.value,
    ativo: true,
    ordem: Date.now()
  });

  nome.value = preco.value = imagem.value = "";
};

// 📦 Listagem automática
const q = query(collection(db, "produtos"), orderBy("ordem", "desc"));

onSnapshot(q, snap => {
  lista.innerHTML = "";

  snap.forEach(d => {
    const p = d.data();
    lista.innerHTML += `
      <div class="card produto">
        <img src="${p.imagem}">
        <div class="info">
          <strong>${p.nome}</strong><br>
          💰 R$ ${p.preco}<br>
          <span class="status ${p.ativo ? 'ativo':'inativo'}">
            ${p.ativo ? 'Ativo' : 'Inativo'}
          </span>
        </div>
        <div>
          <button class="sec"
            onclick="toggle('${d.id}', ${!p.ativo})">
            ${p.ativo ? 'Desativar':'Ativar'}
          </button>
          <button class="del"
            onclick="del('${d.id}')">
            Excluir
          </button>
        </div>
      </div>
    `;
  });
});

window.toggle = async (id, estado) => {
  await updateDoc(doc(db,"produtos",id),{ativo:estado});
};

window.del = async id => {
  if (confirm("Excluir produto?"))
    await deleteDoc(doc(db,"produtos",id));
};
</script>

</body>
</html>
