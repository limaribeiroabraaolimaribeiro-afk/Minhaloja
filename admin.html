<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Administrativo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f4f6f8;
}

header {
  background:#4CAF50;
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:22px;
}

.container {
  padding:15px;
}

.card {
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}

input, select, button {
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ddd;
}

button {
  background:#4CAF50;
  color:#fff;
  border:none;
  font-size:16px;
}

.produto {
  display:flex;
  gap:10px;
  align-items:center;
}

.produto img {
  width:80px;
  border-radius:8px;
}

.produto-info {
  flex:1;
}

.actions button {
  margin-top:5px;
  background:#e53935;
}
</style>
</head>

<body>

<header>📦 Painel de Produtos</header>

<div class="container">

<div class="card">
<h3>➕ Novo Produto</h3>

<input id="nome" placeholder="Nome do produto">
<input id="preco" type="number" placeholder="Preço">
<select id="categoria">
  <option value="Mousses">Mousses</option>
  <option value="Bolos">Bolos</option>
</select>

<button id="btnImagem">📷 Selecionar Imagem</button>
<button id="btnSalvar">Salvar Produto</button>
</div>

<div class="card">
<h3>📋 Produtos cadastrados</h3>
<div id="lista"></div>
</div>

</div>

<script type="module">
import { db, auth } from "./firebase.js";
import {
  collection, addDoc, onSnapshot,
  deleteDoc, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let imagemURL = "";

// 📷 Upload Cloudinary
document.getElementById("btnImagem").onclick = () => {
  cloudinary.openUploadWidget({
    cloudName: "SEU_CLOUD_NAME",
    uploadPreset: "produtos_site",
    language: "pt"
  }, (error, result) => {
    if (!error && result.event === "success") {
      imagemURL = result.info.secure_url;
      alert("Imagem carregada com sucesso!");
    }
  });
};

// 💾 Salvar produto
document.getElementById("btnSalvar").onclick = async () => {
  if (!imagemURL) return alert("Selecione a imagem");

  await addDoc(collection(db, "produtos"), {
    nome: nome.value,
    preco: Number(preco.value),
    categoria: categoria.value,
    imagem: imagemURL,
    ativo: true,
    ordem: Date.now()
  });

  nome.value = preco.value = "";
  imagemURL = "";
};

// 📦 Listar produtos
onSnapshot(collection(db, "produtos"), snap => {
  lista.innerHTML = "";
  snap.forEach(d => {
    const p = d.data();
    lista.innerHTML += `
      <div class="produto">
        <img src="${p.imagem}">
        <div class="produto-info">
          <strong>${p.nome}</strong><br>
          R$ ${p.preco}
        </div>
        <div class="actions">
          <button onclick="del('${d.id}')">Excluir</button>
        </div>
      </div>
    `;
  });
});

window.del = async id => {
  if (confirm("Excluir produto?"))
    await deleteDoc(doc(db, "produtos", id));
};
</script>

</body>
</html>
