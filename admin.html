<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background:#f2f2f2; padding:15px }
.card { background:#fff; padding:15px; border-radius:10px; margin-bottom:15px }
img { width:100px; border-radius:8px }
button { padding:8px; margin-top:5px }
.ativo { color:green }
.inativo { color:red }
</style>
</head>

<body>

<h2>📦 Painel de Produtos</h2>

<div class="card">
<h3>Novo Produto</h3>
<input id="nome" placeholder="Nome"><br>
<input id="preco" type="number" placeholder="Preço"><br>
<input id="imagem" placeholder="URL da imagem"><br>
<button onclick="add()">➕ Adicionar</button>
</div>

<div id="lista"></div>

<script type="module">
import {
  db,
  auth,
  collection,
  addDoc,
  onSnapshot,
  deleteDoc,
  doc,
  updateDoc,
  onAuthStateChanged,
  query,
  orderBy
} from "./firebase.js";

onAuthStateChanged(auth, user => {
  if (!user) window.location.href = "login.html";
});

const lista = document.getElementById("lista");
const q = query(collection(db, "produtos"), orderBy("ordem"));

onSnapshot(q, snap => {
  lista.innerHTML = "";
  snap.forEach(d => {
    const p = d.data();
    lista.innerHTML += `
      <div class="card">
        <img src="${p.imagem}"><br>
        <strong>${p.nome}</strong><br>
        R$ ${p.preco}<br>
        <span class="${p.ativo ? 'ativo' : 'inativo'}">
          ${p.ativo ? 'Ativo' : 'Inativo'}
        </span><br>
        <button onclick="toggle('${d.id}', ${!p.ativo})">
          ${p.ativo ? 'Desativar' : 'Ativar'}
        </button>
        <button onclick="del('${d.id}')">Excluir</button>
      </div>
    `;
  });
});

window.add = async () => {
  await addDoc(collection(db, "produtos"), {
    nome: nome.value,
    preco: Number(preco.value),
    imagem: imagem.value,
    ativo: true,
    ordem: Date.now()
  });
};

window.del = async id => {
  if (confirm("Excluir?"))
    await deleteDoc(doc(db, "produtos", id));
};

window.toggle = async (id, estado) => {
  await updateDoc(doc(db, "produtos", id), { ativo: estado });
};
</script>

</body>
</html>
