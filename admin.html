<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}
h1 { text-align: center; }
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
}
button {
  background: #4CAF50;
  color: #fff;
  border: none;
  font-size: 16px;
}
.produto {
  background: #fff;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h1>📦 Painel de Produtos</h1>

<h3>Novo Produto</h3>
<input id="nome" placeholder="Nome do produto">
<input id="preco" type="number" placeholder="Preço">
<input id="imagem" placeholder="URL da imagem">
<button onclick="adicionarProduto()">Adicionar Produto</button>

<h3>Produtos Cadastrados</h3>
<div id="lista"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCy-zUh5M2KiXvWGfXL17onsOtpzGZXf8Y",
  authDomain: "chiquinho-admin-248b6.firebaseapp.com",
  projectId: "chiquinho-admin-248b6",
  storageBucket: "chiquinho-admin-248b6.firebasestorage.app",
  messagingSenderId: "177897723264",
  appId: "1:177897723264:web:f59f2f0e0f456c9bbd5d65"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function adicionarProduto() {
  const nome = document.getElementById("nome").value;
  const preco = Number(document.getElementById("preco").value);
  const imagem = document.getElementById("imagem").value;

  db.collection("produtos").add({
    nome,
    preco,
    imagem,
    ativo: true,
    criadoEm: new Date()
  }).then(() => {
    alert("Produto adicionado!");
    listarProdutos();
  });
}

<script>
function listarProdutos() {
  document.getElementById("lista").innerHTML = "";
  db.collection("produtos").onSnapshot(snapshot => {
    snapshot.forEach(doc => {
      const p = doc.data();
      const id = doc.id;

      document.getElementById("lista").innerHTML += `
        <div class="produto">
          <strong>${p.nome}</strong><br>
          R$ ${p.preco}<br>

          <button onclick="ativarProduto('${id}', ${!p.ativo})">
            ${p.ativo ? 'Desativar' : 'Ativar'}
          </button>

          <button onclick="excluirProduto('${id}')" style="background:red;">
            Excluir
          </button>
        </div>
      `;
    });
  });
}

function ativarProduto(id, status) {
  db.collection("produtos").doc(id).update({
    ativo: status
  });
}

function excluirProduto(id) {
  if (confirm("Excluir produto?")) {
    db.collection("produtos").doc(id).delete();
  }
}
</script>


</body>
</html>
