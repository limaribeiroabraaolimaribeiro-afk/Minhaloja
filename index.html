<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>🍨 Chiquinho dos Doces</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #4a2c2a;
}

.subtitulo {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

.produto {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
}

.produto img {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 12px;
}

.preco {
  color: #1b8f3a;
  font-weight: bold;
  font-size: 18px;
}

.botao {
  width: 100%;
  padding: 14px;
  background: #25D366;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🍨 Chiquinho dos Doces</h1>
<p class="subtitulo">Mousses artesanais • Todos por R$ 15,00</p>

<div id="produtos"></div>

<!-- 🔥 Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_AUTH_DOMAIN",
  projectId: "SEU_PROJECT_ID",
  storageBucket: "SEU_STORAGE",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lista = document.getElementById("produtos");

const q = query(
  collection(db, "produtos"),
  orderBy("ordem", "desc")
);

onSnapshot(q, snapshot => {
  lista.innerHTML = "";

  snapshot.forEach(doc => {
    const p = doc.data();
    if (!p.ativo) return;

    lista.innerHTML += `
      <div class="produto">
        <img src="${p.imagem}">
        <h2>${p.nome}</h2>
        <p class="preco">R$ ${p.preco}</p>

        <button class="botao"
          onclick="comprar('${p.nome}', ${p.preco})">
          Comprar pelo WhatsApp
        </button>
      </div>
    `;
  });
});

window.comprar = (nome, preco) => {
  const msg =
    `Olá! Quero fazer um pedido:\n\n` +
    `🍮 Produto: ${nome}\n` +
    `💰 Preço: R$ ${preco}`;

  window.open(
    "https://wa.me/5547992101675?text=" + encodeURIComponent(msg),
    "_blank"
  );
};
</script>

</body>
</html>
