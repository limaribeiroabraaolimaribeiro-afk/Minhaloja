<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Chiquinho dos Doces</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a2c2a">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #4a2c2a;
}

.subtitulo {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.produto {
  background: #fff;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.produto img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
}

.preco {
  font-weight: bold;
  color: #1b8f3a;
}

.botao {
  width: 100%;
  padding: 14px;
  background: #25D366;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🍨 Chiquinho dos Doces</h1>
<p class="subtitulo">Mousses artesanais • Encomendas pelo WhatsApp</p>

<div id="produtos"></div>

<div class="produto">
  <h2>💳 Formas de Pagamento</h2>
  <p><strong>Pix:</strong> 13965602977</p>
  <p>Envie o comprovante pelo WhatsApp após o pagamento.</p>
</div>

<button class="botao" onclick="confirmarPagamento()">
✅ Já paguei – confirmar pedido
</button>

<!-- 🔥 FIREBASE + FIRESTORE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, onSnapshot } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCy-zUh5M2KiXvWGfXL17onsOtpzGZXf8Y",
  authDomain: "chiquinho-admin-248b6.firebaseapp.com",
  projectId: "chiquinho-admin-248b6",
  storageBucket: "chiquinho-admin-248b6.firebasestorage.app",
  messagingSenderId: "177897723264",
  appId: "1:177897723264:web:f59f2f0e0f456c9bbd5d65"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("produtos");

const q = query(
  collection(db, "produtos"),
  where("ativo", "==", true),
  orderBy("ordem")
);

// 🔄 Atualiza produtos automaticamente
onSnapshot(q, snapshot => {
  container.innerHTML = "";

  snapshot.forEach(doc => {
    const p = doc.data();

    container.innerHTML += `
      <div class="produto">
        <img src="${p.imagem}">
        <h2>${p.nome}</h2>
        <p class="preco">R$ ${p.preco}</p>
        <button class="botao"
          onclick="comprar('${p.nome}', ${p.preco})">
          Comprar pelo WhatsApp
        </button>
      </div>
    `;
  });
});
</script>

<script>
function comprar(produto, preco) {
  const msg =
    Olá! Quero fazer um pedido:\n\n +
    🍮 Produto: ${produto}\n +
    💰 Valor: R$ ${preco}\n\n +
    Aguardo instruções 😊;

  window.open(
    "https://wa.me/5547992101675?text=" + encodeURIComponent(msg),
    "_blank"
  );
}

function confirmarPagamento() {
  const msg =
    "Olá! Já realizei o pagamento do meu pedido ✅\n\n" +
    "Estou enviando o comprovante agora.";

  window.open(
    "https://wa.me/5547992101675?text=" + encodeURIComponent(msg),
    "_blank"
  );
}
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
