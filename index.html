<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Chiquinho dos Doces</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #4a2c2a;
}

.subtitulo {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.produto {
  background: #fff;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.preco {
  font-weight: bold;
  color: #1b8f3a;
}

.botao {
  width: 100%;
  padding: 14px;
  background: #25D366;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🍨 Chiquinho dos Doces</h1>
<p class="subtitulo">Todos os mousses por <strong>R$ 15,00</strong></p>

<!-- PRODUTO -->
<div class="produto">
<h2>Mousse de Chocolate ao Leite</h2>
<p class="preco">R$ 15,00</p>

<label>Horário:</label><br>
<input type="time" id="hora-chocolate"><br><br>

<label>Quantidade:</label><br>
<input type="number" id="qtd-chocolate" value="1" min="1"><br>

<button class="botao"
onclick="comprar('Mousse de Chocolate ao Leite',15,'qtd-chocolate','hora-chocolate')">
Comprar pelo WhatsApp
</button>
</div>

<!-- PRODUTO -->
<div class="produto">
<h2>Mousse de Morango</h2>
<p class="preco">R$ 15,00</p>

<label>Horário:</label><br>
<input type="time" id="hora-morango"><br><br>

<label>Quantidade:</label><br>
<input type="number" id="qtd-morango" value="1" min="1"><br>

<button class="botao"
onclick="comprar('Mousse de Morango',15,'qtd-morango','hora-morango')">
Comprar pelo WhatsApp
</button>
</div>

<!-- PAGAMENTO -->
<div class="produto">
<h2>💳 Formas de Pagamento</h2>
<p><strong>Pix:</strong> 13965602977</p>
<p>Envie o comprovante pelo WhatsApp</p>
</div>

<script>
function comprar(produto, preco, idQtd, idHora) {
  const qtd = document.getElementById(idQtd).value;
  const hora = document.getElementById(idHora).value;

  if (!hora) {
    alert("Selecione o horário.");
    return;
  }

  const total = (preco * qtd).toFixed(2).replace('.', ',');

  navigator.geolocation.getCurrentPosition(function(pos) {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const msg =
      "Olá! Quero fazer um pedido:%0A%0A" +
      "🍮 Produto: " + produto + "%0A" +
      "📦 Quantidade: " + qtd + "%0A" +
      "💰 Total: R$ " + total + "%0A" +
      "⏰ Horário: " + hora + "%0A%0A" +
      "📍 Localização:%0A" +
      "https://www.google.com/maps?q=" + lat + "," + lon;

    window.open("https://wa.me/5547992101675?text=" + msg, "_blank");
  });
}
</script>

</body>
</html>
