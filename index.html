<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Chiquinho dos Doces</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a2c2a">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #4a2c2a;
}

.subtitulo {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.produto {
  background: #fff;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.produto img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
}

.preco {
  font-weight: bold;
  color: #1b8f3a;
}

.botao {
  width: 100%;
  padding: 14px;
  background: #25D366;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  margin-top: 10px;
}
</style>
  <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCy-zUh5M2KiXvWGfXL17onsOtpzGZXf8Y",
    authDomain: "chiquinho-admin-248b6.firebaseapp.com",
    projectId: "chiquinho-admin-248b6",
    storageBucket: "chiquinho-admin-248b6.firebasestorage.app",
    messagingSenderId: "177897723264",
    appId: "1:177897723264:web:f59f2f0e0f456c9bbd5d65"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
</script>
</head>

<body>

<h1>🍨 Chiquinho dos Doces</h1>
<p class="subtitulo">Mousses artesanais • Todos por <strong>R$ 15,00</strong></p>

<script>
function produtoHTML(nome, imagem, idQtd, idHora) {
  return `
  <div class="produto">
    <img src="imagens/${imagem}" alt="${nome}">
    <h2>${nome}</h2>
    <p class="preco">R$ 15,00</p>

    <label>Horário:</label><br>
    <input type="time" id="${idHora}"><br><br>

    <label>Quantidade:</label><br>
    <input type="number" id="${idQtd}" value="1" min="1"><br>

    <button class="botao"
      onclick="comprar('${nome}',15,'${idQtd}','${idHora}')">
      Comprar pelo WhatsApp
    </button>
  </div>`;
}
</script>

<div id="lista"></div>

<div class="produto">
<h2>💳 Formas de Pagamento</h2>
<p><strong>Pix:</strong> 13965602977</p>
<p>Envie o comprovante pelo WhatsApp após o pagamento.</p>
<p><strong>Cartão crédito/débito:</strong> combinado no WhatsApp.</p>
</div>
  
  <button class="botao"
onclick="confirmarPagamento()">
✅ Já paguei – confirmar pedido
  </button>

<script>
document.getElementById("lista").innerHTML =
produtoHTML(
  "Mousse de Maracujá",
  "IMG-20251212-WA0012.jpg",
  "qtd1",
  "hora1"
) +
produtoHTML(
  "Mousse de Morango",
  "IMG-20251231-WA0016.jpg",
  "qtd2",
  "hora2"
) +
produtoHTML(
  "Mousse de Salada de Frutas",
  "IMG-20251231-WA0017.jpg",
  "qtd3",
  "hora3"
) +
produtoHTML(
  "Mousse de Chocolate Amargo",
  "IMG-20251231-WA0018.jpg",
  "qtd4",
  "hora4"
);

function comprar(produto, preco, idQtd, idHora) {
  const qtd = document.getElementById(idQtd).value;
  const hora = document.getElementById(idHora).value;

  if (!hora) {
    alert("Selecione o horário.");
    return;
  }

  navigator.geolocation.getCurrentPosition(function(pos) {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const total = (preco * qtd).toFixed(2).replace('.', ',');

    const msg =
      `Olá! Quero fazer um pedido:\n\n` +
      `🍮 Produto: ${produto}\n` +
      `📦 Quantidade: ${qtd}\n` +
      `💰 Total: R$ ${total}\n` +
      `⏰ Horário: ${hora}\n\n` +
      `📍 Localização:\nhttps://www.google.com/maps?q=${lat},${lon}`;

    window.open(
      "https://wa.me/5547992101675?text=" + encodeURIComponent(msg),
      "_blank"
    );
  });
}
</script>
  <script>
function confirmarPagamento() {
  const msg =
    "Olá! Já realizei o pagamento do meu pedido ✅\n\n" +
    "Estou enviando o comprovante agora.";

  window.open(
    "https://wa.me/5547992101675?text=" + encodeURIComponent(msg),
    "_blank"
  );
}
  </script>
  <script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("Service Worker registrado"))
    .catch(err => console.log("Erro no SW", err));
}
  </script>
  <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js')
      .then(function (registration) {
        console.log('Service Worker registrado com sucesso:', registration.scope);
      })
      .catch(function (error) {
        console.log('Falha ao registrar o Service Worker:', error);
      });
  });
}
  </script>
<script type="module" src="./firebase.js"></script>
<script type="module" src="./produtos.js"></script>

</body>
</html>
